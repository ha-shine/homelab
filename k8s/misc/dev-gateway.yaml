# Serving *.dev.sorrentolab.dev
apiVersion: v1
kind: Service
metadata:
  name: traefik-tailnet
  namespace: kube-system
  annotations:
    tailscale.com/hostname: dev-gateway
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/instance: traefik-kube-system
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
    - name: websecure
      port: 443
      targetPort: websecure
