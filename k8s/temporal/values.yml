# Values file for temporalio/temporal helm
server:
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12_pgx
            driverName: postgres12_pgx
            databaseName: temporal
            connectAddr: temporal-postgresql.temporal.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-postgresql-secret
            secretKey: password
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: 1h
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12_pgx
            driverName: postgres12_pgx
            databaseName: temporal_visibility
            connectAddr: temporal-postgresql.temporal.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-postgresql-secret
            secretKey: password
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: 1h
    namespaces:
      create: true
      namespace:
        - name: default
          retention: 3d

  frontend:
    enabled: true
    service:
      type: ClusterIP
      port: 7233

web:
  enabled: true
  service:
    type: ClusterIP
    port: 8080
