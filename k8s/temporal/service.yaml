apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend-dev
  namespace: temporal
  annotations:
    tailscale.com/hostname: temporal-frontend-dev # Machine name in the tailnet
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: temporal
    app.kubernetes.io/name: temporal
  ports:
    - name: grpc-rpc
      port: 7233
      protocol: TCP
      targetPort: rpc
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-web-dev
  namespace: temporal
  annotations:
    tailscale.com/hostname: temporal-web-dev # Machine name in the tailnet
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: temporal
    app.kubernetes.io/name: temporal
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
