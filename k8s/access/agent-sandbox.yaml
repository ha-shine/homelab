apiVersion: v1
kind: Namespace
metadata:
  name: cluster-access
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sandbox
  namespace: cluster-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-sandbox-cluster-admin
subjects:
  - kind: ServiceAccount
    name: agent-sandbox
    namespace: cluster-access
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
